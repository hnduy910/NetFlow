name: NetFlow
options:
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
targets:
  NetFlow:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NetFlow
        excludes:
          - Preview
          - Resources
    resources:
      - path: NetFlow/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duyhoang.netflow
        PRODUCT_NAME: NetFlow
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_ENTITLEMENTS: NetFlow/NetFlow.entitlements
        MARKETING_VERSION: 4.1.8
        CURRENT_PROJECT_VERSION: 24
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NetFlow/Info.plist
    info:
      path: NetFlow/Info.plist
