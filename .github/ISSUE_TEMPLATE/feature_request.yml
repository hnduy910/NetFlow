name: Feature request
description: Suggest a focused improvement for NetFlow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. NetFlow favors native, local-first features with minimal dependencies.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve for you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — note any workarounds or alternative designs.
