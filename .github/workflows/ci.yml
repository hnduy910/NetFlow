name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependency
        run: python3 -m pip install --user pillow
      - name: Static project checks
        run: bash Tools/check_project.sh
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project NetFlow.xcodeproj \
            -target NetFlow \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
